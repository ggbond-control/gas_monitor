serial_gas_node:
  ros__parameters:
    serial_port: /dev/ttyUSB0
    baud_rate: 9600
    parity: "none"                                  # none/even/odd
    poll_interval_ms: 1000
    startup_timeout_seconds: 120
    fail_on_startup_timeout: false
    inter_request_delay_ms: 500
    response_timeout_ms: 1000
    alarm_repeat_seconds: 10
    max_retries_per_slave: 3
    slave_ids: [1, 2, 3, 4]
    use_config_alarm_thresholds: true               # false使用设备寄存器阈值，true使用配置覆盖阈值
    alarm_threshold_slave_ids: [1, 2, 3, 4]
    low_alarm_overrides: [1.0, 2.0, 20.0, 15.0]     # [1.0, 2.0, 20.0, 15.0]
    high_alarm_overrides: [3.0, 5.0, 50.0, 30.0]    # [3.0, 5.0, 50.0, 30.0]
    gas_type_overrides: ["HF", "SO2", "CH4", "H2S"] # ["HF", "SO2", "CH4", "H2S"]
